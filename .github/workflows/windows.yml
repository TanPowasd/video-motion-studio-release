name: Windows verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      portable:
        description: Build and verify a portable release candidate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      VMOTION_GPU: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/vmotion-core
            crates/vmotion-gpu
      - run: npm ci
      - run: npm run native:build
      - name: Configure local FFmpeg and fonts
        run: |
          node --import tsx --input-type=module -e "import {prepareRuntime} from './scripts/prepare-runtime.ts'; await prepareRuntime(process.cwd());"
          $runtime = Join-Path $PWD 'dist/runtime'
          "VMOTION_RUNTIME=$runtime" >> $env:GITHUB_ENV
      - run: npm run typecheck
      - run: npm run test:fast
      - run: npm run test:integration
      - run: npm test
      - run: npm run build
      - name: Portable release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.portable
        run: npx tsx scripts/package.ts
      - name: Actual stdio, portable and desktop acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.portable
        run: npm run test:acceptance
      - name: Explicit GPU scope
        run: Write-Output 'Hosted CI verifies CPU fallback. Hardware GPU parity is verified separately with VMOTION_TEST_GPU=1 on the reference workstation.'
